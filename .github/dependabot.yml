# Weekly update PRs, bundled per ecosystem: this keeps the pinned versions
# in uv.lock, the actions' SHA pins and the image digests current.
# Dependabot proposes no major versions and no switch to a new Python:
# such jumps (for example azurerm 5 or openai 3) need tests, a
# Terraform plan with Azure access and often code changes, so a PR of their own.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # CI and the local .venv run on 3.13; new builds of 3.13-slim
      # keep coming, the tag stays 3.13.
      - dependency-name: "python"
        versions: [">= 3.14"]

  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
