name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JOBFINDER_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder
      JOBFINDER_TEST_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test_postgres.py

  style-and-frontend:
    name: Python style and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check job_finder scripts tests run_finder.py
      - run: python -m ruff format --check job_finder scripts tests run_finder.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/frontend.test.cjs

  # Nur bei Pull Requests: zeigt, was ein Merge an der Infrastruktur ändern
  # würde. Rein lesend, kein apply - unabhängig vom Testergebnis interessant.
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=2m
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}

  # Baut und pusht nur, wenn die Tests auf main erfolgreich waren.
  # Tag = Commit-SHA statt manueller Versionsnummer: eindeutig, kein
  # Koordinationsaufwand, direkt auf den erzeugenden Commit rückführbar.
  docker-build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [python, style-and-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acrjobfinder
      - run: |
          docker build -t acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }} .
          docker push acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }}

  # Aktualisiert Worker und Review-App auf das neue Image. Läuft im
  # production-Environment: GitHub hält hier an, bis der hinterlegte
  # Reviewer manuell zustimmt (die "kontrolliert" aus der Roadmap-Vorgabe).
  # Erst danach führt terraform apply auch echte Infrastrukturänderungen aus.
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=2m
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}
          TF_VAR_image_tag: ${{ needs.docker-build-push.outputs.image_tag }}
