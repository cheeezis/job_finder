name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JOBFINDER_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder
      JOBFINDER_TEST_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
      # Genau die Versionen aus uv.lock; --frozen ändert das Lockfile nie.
      - run: uv sync --frozen
      # pytest gegen die Test-Datenbank; die Abdeckung je Datei steht in der
      # Zusammenfassung des Laufs und dient zum Finden von Lücken, nicht als Ziel.
      - run: >-
          uv run --frozen python scripts/test_postgres.py
          --cov --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

  style-and-frontend:
    name: Python style and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      # Scheitert, wenn pyproject.toml ohne passendes uv.lock geändert wurde.
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      # Typprüfung; welche Pakete sie schon abdeckt, steht in pyproject.toml.
      - run: uv run --frozen pyright
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/frontend.test.cjs

  # Klickt die Kernabläufe der Review in Chromium durch, auf frisch befüllten
  # Demo-Daten: Steckbrief, Entscheidung mit Notiz, Warteliste, Rückgängig,
  # Bewerbung mit Dokument (tests/test_review_browser.py).
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JOBFINDER_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder
      JOBFINDER_TEST_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder_test
      JOBFINDER_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --frozen
      # Der zur Playwright-Version aus uv.lock passende Chromium samt Systembibliotheken.
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen python scripts/test_postgres.py tests/test_review_browser.py

  # Führt "Quickstart (local)" und "Demo" aus dem README auf einem frischen
  # Runner aus, damit die Anleitung nicht unbemerkt veraltet. Der Finder läuft
  # nur mit der Quelle manual, die ohne Internet auskommt: Fremde Jobbörsen
  # sollen diese Prüfung nicht kippen. Ohne DISCORD_WEBHOOK_URL sendet nichts.
  quickstart:
    name: Quickstart from the README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/setup_postgres.py
      - run: docker compose --env-file .env.postgres up -d --wait
      - run: uv run --frozen python -m job_finder.db init
      - run: uv run --frozen python run_finder.py --only-sources manual
      - name: Review antwortet
        run: |
          uv run --frozen python -m job_finder.review --no-browser &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8765/
      - name: Demo antwortet
        run: |
          uv run --frozen python scripts/demo_data.py --serve &
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8770/

  # Prüft den Terraform-Code ohne Azure-Zugang: tflint auf Fehler und
  # Warnungen, Trivy auf unsichere Einstellungen; jeder neue Befund bricht ab.
  # Bewusste Abwägungen stehen mit Begründung in infrastructure/.trivyignore.yaml.
  # Trivy läuft ohne Cache und ohne Regel-Update, also mit den Regeln seiner
  # festen Version (daher die Log-Zeile "Falling back to embedded checks"):
  # Neue Regeln kommen nur mit einem Update der Action, nicht in fremden PRs.
  infrastructure-checks:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact --minimum-failure-severity=warning
      - name: Unsichere Einstellungen prüfen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: infrastructure
          trivyignores: infrastructure/.trivyignore.yaml
          cache: "false"
          exit-code: "1"

  # Nur bei Pull Requests: zeigt, was ein Merge an der Infrastruktur ändern
  # würde. Rein lesend, kein apply - unabhängig vom Testergebnis interessant.
  # Pull Requests aus Forks und von Dependabot haben keinen Azure-Zugang; für
  # sie entfällt der Plan, das Apply nach dem Merge plant ohnehin vollständig.
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      # Eigene Identität, die nur lesen darf. Ohne Sperre (-lock=false), weil
      # schon das Sperren ein Schreibvorgang auf dem State wäre. Ohne
      # Nachladen aus Azure (-refresh=false): azurerm liest die Container Apps
      # per listSecrets, und das liefert die echten Geheimniswerte. Der Plan
      # vergleicht Code mit dem State; das Apply lädt weiterhin vollständig nach.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      # Nur simulierte Provider; unabhängig von Azure-State und echten Secrets.
      - run: terraform test -no-color
      - run: terraform plan -input=false -lock=false -refresh=false
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_review_fqdn: ${{ secrets.REVIEW_FQDN }}
          TF_VAR_runtime_identity_phase: ${{ vars.RUNTIME_IDENTITY_PHASE || 'legacy' }}
          TF_VAR_runtime_access_verified: ${{ vars.RUNTIME_ACCESS_VERIFIED || 'false' }}
          TF_VAR_database_auth_phase: ${{ vars.DATABASE_AUTH_PHASE || 'password' }}
          TF_VAR_database_entra_verified: ${{ vars.DATABASE_ENTRA_VERIFIED || 'false' }}
          # Secret, nicht Variable: Der Anmeldename kann eine E-Mail-Adresse enthalten, und
          # Variablen erscheinen ungeschwärzt in den öffentlichen Logs.
          TF_VAR_postgres_entra_admin_name: ${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}

  # Baut das Image schon im Pull Request, startet es kurz als Probe und prüft
  # es auf bekannte Lücken; ein kaputtes Dockerfile fällt so vor dem Merge auf.
  container:
    name: Container image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t jobfinder:check .
      - name: Probestart als eingeschränkter Benutzer
        run: >-
          docker run --rm --entrypoint sh jobfinder:check -c
          'test "$(id -u)" != 0 && touch data/probe && python -c "import run_finder, job_finder.review"'
      - name: Lücken melden (hoch und kritisch)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobfinder:check
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Bei behebbaren kritischen Lücken abbrechen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobfinder:check
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Baut und pusht nur, wenn die Tests auf main erfolgreich waren.
  # Tag = Commit-SHA statt manueller Versionsnummer: eindeutig, kein
  # Koordinationsaufwand, direkt auf den erzeugenden Commit rückführbar.
  docker-build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [python, style-and-frontend, quickstart, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      # Eigene Identität, die nur Images hochladen darf - nicht die des Applys.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_BUILD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acrjobfinder
      - run: docker build -t acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }} .
      - name: Probestart als eingeschränkter Benutzer
        run: >-
          docker run --rm --entrypoint sh acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }} -c
          'test "$(id -u)" != 0 && touch data/probe && python -c "import run_finder, job_finder.review"'
      - name: Bei behebbaren kritischen Lücken abbrechen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }}

  # Aktualisiert Worker und Review-App auf das neue Image. Läuft im
  # production-Environment: GitHub hält hier an, bis der hinterlegte
  # Reviewer manuell zustimmt (die "kontrolliert" aus der Roadmap-Vorgabe).
  # Erst danach führt terraform apply auch echte Infrastrukturänderungen aus.
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    environment: production
    # Nie zwei Deploys gleichzeitig; ein neu ankommender verdrängt einen noch
    # auf Freigabe wartenden.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Die Concurrency-Gruppe ordnet nach Ankunft, nicht nach Commit: Ein
      # älterer Lauf, dessen Image später fertig wird, käme nach dem neueren
      # an. Geprüft wird nach der Freigabe, direkt vor dem Ausrollen.
      - name: Nur den aktuellen main-Stand ausrollen
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Veralteter Stand ${GITHUB_SHA::12}, main steht auf ${latest::12}. Deploy abgebrochen."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=2m
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_review_fqdn: ${{ secrets.REVIEW_FQDN }}
          TF_VAR_runtime_identity_phase: ${{ vars.RUNTIME_IDENTITY_PHASE || 'legacy' }}
          TF_VAR_runtime_access_verified: ${{ vars.RUNTIME_ACCESS_VERIFIED || 'false' }}
          TF_VAR_database_auth_phase: ${{ vars.DATABASE_AUTH_PHASE || 'password' }}
          TF_VAR_database_entra_verified: ${{ vars.DATABASE_ENTRA_VERIFIED || 'false' }}
          # Secret, nicht Variable: Der Anmeldename kann eine E-Mail-Adresse enthalten, und
          # Variablen erscheinen ungeschwärzt in den öffentlichen Logs.
          TF_VAR_postgres_entra_admin_name: ${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}
      # Terraform ignoriert das Image (lifecycle.ignore_changes); die
      # App-Version wird ausschließlich hier gesetzt.
      - name: Image ausrollen
        run: |
          image="acrjobfinder.azurecr.io/jobfinder:${{ needs.docker-build-push.outputs.image_tag }}"
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update --name jobfinder-worker --resource-group rg-jobfinder --image "$image" --output none
          az containerapp update --name jobfinder-review --resource-group rg-jobfinder --image "$image" --output none
      # Ohne Anmeldung darf die Review nichts ausliefern: Ein Aufruf muss auf
      # den Login umleiten (302) oder abgewiesen werden (401). Die App startet
      # beim ersten Aufruf erst (Scale to Zero), daher mehrere Versuche.
      - name: Review ohne Anmeldung prüfen
        env:
          REVIEW_FQDN: ${{ secrets.REVIEW_FQDN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://$REVIEW_FQDN/api/recommendations" || true)
            case "$status" in
              302|401) echo "Ohne Anmeldung: HTTP $status"; exit 0 ;;
              200) echo "::error::Die Review liefert ohne Anmeldung Daten aus."; exit 1 ;;
            esac
            echo "Versuch $attempt: HTTP $status, neuer Versuch in 20 Sekunden"
            sleep 20
          done
          echo "::error::Die Review war nach dem Deploy nicht erreichbar."
          exit 1
