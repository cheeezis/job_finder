name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JOBFINDER_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder
      JOBFINDER_TEST_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
      # Exactly the versions in uv.lock; --frozen never changes the lock file.
      - run: uv sync --frozen
      # pytest against the test database; the coverage per file is in the run's
      # summary and serves to find gaps, not as a goal.
      - run: >-
          uv run --frozen python scripts/test_postgres.py
          --cov --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

  style-and-frontend:
    name: Python style and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      # Fails when pyproject.toml was changed without a matching uv.lock.
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      # Type check; pyproject.toml says which packages it covers so far.
      - run: uv run --frozen pyright
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/frontend.test.cjs
      # Type check of the browser scripts against the types from the OpenAPI schema;
      # also fails when api-types.d.ts no longer matches the server.
      - run: npm ci --no-audit --no-fund
      - run: npm run check:types
      - run: npm run types:api && git diff --exit-code job_finder/api-types.d.ts

  # Clicks through the review's core flows in Chromium, on freshly filled
  # demo data: fact sheet, decision with note, waiting list, undo,
  # application with a document (tests/test_review_browser.py).
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JOBFINDER_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder
      JOBFINDER_TEST_DATABASE_URL: postgresql://jobfinder:ci-test-only@127.0.0.1:5432/jobfinder_test
      JOBFINDER_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --frozen
      # The Chromium matching the Playwright version in uv.lock, with its system libraries.
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen python scripts/test_postgres.py tests/test_review_browser.py

  # Runs "Quickstart (local)" and "Demo" from the README on a fresh runner,
  # so the instructions do not go stale unnoticed. The finder runs only with
  # the source manual, which needs no internet: third-party job boards
  # should not break this check. Without DISCORD_WEBHOOK_URL nothing is sent.
  quickstart:
    name: Quickstart from the README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/setup_postgres.py
      - run: docker compose --env-file .env.postgres up -d --wait
      - run: uv run --frozen python -m job_finder.db init
      - run: uv run --frozen python run_finder.py --only-sources manual
      - name: Review answers
        run: |
          uv run --frozen python -m job_finder.review --no-browser &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8765/
      - name: Demo answers
        run: |
          uv run --frozen python scripts/demo_data.py --serve &
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8770/

  # Checks the Terraform code without Azure access: tflint for errors and
  # warnings, Trivy for insecure settings; every new finding fails.
  # Deliberate trade-offs are listed with their reason in infrastructure/.trivyignore.yaml.
  # Trivy runs without cache and without a rule update, so with the rules of its
  # fixed version (hence the log line "Falling back to embedded checks"):
  # new rules come only with an update of the action, not in other people's PRs.
  infrastructure-checks:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact --minimum-failure-severity=warning
      - name: Check for insecure settings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        with:
          scan-type: config
          scan-ref: infrastructure
          trivyignores: infrastructure/.trivyignore.yaml
          cache: "false"
          exit-code: "1"

  # Pull requests only: shows what a merge would change in the infrastructure.
  # Read-only, no apply - of interest regardless of the test result.
  # Pull requests from forks and from Dependabot have no Azure access; for
  # them the plan is skipped, the apply after the merge plans completely anyway.
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      # Own identity that may only read. Without a lock (-lock=false), because
      # the lock itself would already be a write to the state. Without
      # refreshing from Azure (-refresh=false): azurerm reads the container apps
      # through listSecrets, which returns the real secret values. The plan
      # compares code with the state; the apply still refreshes completely.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      # Only simulated providers; independent of Azure state and real secrets.
      - run: terraform test -no-color
      - run: terraform plan -input=false -lock=false -refresh=false
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_review_fqdn: ${{ secrets.REVIEW_FQDN }}
          TF_VAR_runtime_identity_phase: ${{ vars.RUNTIME_IDENTITY_PHASE || 'legacy' }}
          TF_VAR_runtime_access_verified: ${{ vars.RUNTIME_ACCESS_VERIFIED || 'false' }}
          TF_VAR_database_auth_phase: ${{ vars.DATABASE_AUTH_PHASE || 'password' }}
          TF_VAR_database_entra_verified: ${{ vars.DATABASE_ENTRA_VERIFIED || 'false' }}
          # A secret, not a variable: the sign-in name can contain an email address, and
          # variables appear unmasked in the public logs.
          TF_VAR_postgres_entra_admin_name: ${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}

  # Builds the image already in the pull request, starts it briefly as a trial and
  # scans it for known vulnerabilities; a broken Dockerfile shows up before the merge.
  container:
    name: Container image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t jobfinder:check .
      - name: Trial start as a restricted user
        run: >-
          docker run --rm --entrypoint sh jobfinder:check -c
          'test "$(id -u)" != 0 && touch data/probe && python -c "import run_finder, job_finder.review"'
      - name: Report vulnerabilities (high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobfinder:check
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobfinder:check
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Builds and pushes only when the tests on main passed.
  # Tag = commit SHA instead of a manual version number: unique, no
  # coordination effort, directly traceable to the commit that produced it.
  docker-build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [python, style-and-frontend, quickstart, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_ref: ${{ steps.digest.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      # Own identity that may only push images - not the apply's.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_BUILD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acrjobfinder
      - run: docker build -t acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }} .
      - name: Trial start as a restricted user
        run: >-
          docker run --rm --entrypoint sh acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }} -c
          'test "$(id -u)" != 0 && touch data/probe && python -c "import run_finder, job_finder.review"'
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }}
      # The immutable digest is rolled out, not the tag.
      - id: digest
        name: Record the image digest
        run: |
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' acrjobfinder.azurecr.io/jobfinder:${{ steps.tag.outputs.tag }})
          case "$ref" in
            acrjobfinder.azurecr.io/jobfinder@sha256:*) echo "ref=$ref" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No digest found for the new image."; exit 1 ;;
          esac

  # After the merge, creates the plan reconciled with the real Azure state
  # and stores it privately next to the Terraform state: plans can contain secret
  # values and do not belong in the public artifacts. The run's summary
  # names only resources and actions. The approval of production then applies
  # to exactly this plan. production-plan is limited to main and has no
  # approval pause; the apply identity is cleared for it specifically.
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    environment: production-plan
    concurrency:
      group: production-plan
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.store.outputs.sha256 }}
    defaults:
      run:
        working-directory: infrastructure
    env:
      PLAN_BLOB: release-plans/${{ github.sha }}.tfplan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=2m -out=release.tfplan
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_postgres_client_ipv4: ${{ secrets.POSTGRES_CLIENT_IPV4 }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_review_fqdn: ${{ secrets.REVIEW_FQDN }}
          TF_VAR_runtime_identity_phase: ${{ vars.RUNTIME_IDENTITY_PHASE || 'legacy' }}
          TF_VAR_runtime_access_verified: ${{ vars.RUNTIME_ACCESS_VERIFIED || 'false' }}
          TF_VAR_database_auth_phase: ${{ vars.DATABASE_AUTH_PHASE || 'password' }}
          TF_VAR_database_entra_verified: ${{ vars.DATABASE_ENTRA_VERIFIED || 'false' }}
          # A secret, not a variable: the sign-in name can contain an email address, and
          # variables appear unmasked in the public logs.
          TF_VAR_postgres_entra_admin_name: ${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}
      # Only addresses and actions; the JSON output itself would contain values.
      - name: Summary without values
        run: |
          terraform show -json release.tfplan | python3 -c '
          import json, sys
          plan = json.load(sys.stdin)
          rows = [(" + ".join(change["change"]["actions"]), change["address"])
                  for change in plan.get("resource_changes", [])
                  if change["change"]["actions"] not in (["no-op"], ["read"])]
          print("### Terraform plan for approval\n")
          print("\n".join("- `%s` %s" % row for row in rows) or "No change to the infrastructure.")
          ' >> "$GITHUB_STEP_SUMMARY"
      - id: store
        name: Store the plan privately
        run: |
          sha=$(sha256sum release.tfplan | cut -d" " -f1)
          az storage blob upload --auth-mode login --account-name stjobfindere64bfdce --container-name tfstate \
            --name "$PLAN_BLOB" --file release.tfplan --overwrite --only-show-errors --output none
          rm release.tfplan
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          printf '\nPlan checksum: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

  # After the manual approval in the production environment, applies exactly
  # the checked plan and rolls out the image by digest. Terraform refuses
  # a plan whose state has changed since it was created.
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [docker-build-push, release-plan]
    environment: production
    # Never two deploys at once; a newly arriving one displaces one still
    # waiting for approval.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The concurrency group orders by arrival, not by commit: an older run
      # whose image is ready later would arrive after the newer one.
      # The check happens after the approval, right before the rollout.
      - name: Roll out only the current main
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Outdated commit ${GITHUB_SHA::12}, main is at ${latest::12}. Deploy aborted."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - name: Load and verify the approved plan
        env:
          PLAN_BLOB: release-plans/${{ github.sha }}.tfplan
          EXPECTED_SHA256: ${{ needs.release-plan.outputs.plan_sha256 }}
        run: |
          az storage blob download --auth-mode login --account-name stjobfindere64bfdce --container-name tfstate \
            --name "$PLAN_BLOB" --file release.tfplan --only-show-errors --output none
          echo "$EXPECTED_SHA256  release.tfplan" | sha256sum --check --status \
            || { echo "::error::The stored plan differs from the checked one."; exit 1; }
      - run: terraform apply -input=false -lock-timeout=2m release.tfplan
        env:
          # Ephemeral variables are not in the saved plan; the apply needs them again.
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      - name: Remove the stored plan
        if: always()
        env:
          PLAN_BLOB: release-plans/${{ github.sha }}.tfplan
        run: |
          rm -f release.tfplan
          az storage blob delete --auth-mode login --account-name stjobfindere64bfdce --container-name tfstate \
            --name "$PLAN_BLOB" --only-show-errors --output none || true
      - name: Record the previous image as the way back
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          worker=$(az containerapp job show --name jobfinder-worker --resource-group rg-jobfinder --query "properties.template.containers[0].image" -o tsv)
          review=$(az containerapp show --name jobfinder-review --resource-group rg-jobfinder --query "properties.template.containers[0].image" -o tsv)
          printf '### Way back\n\nPrevious worker image: `%s`\nPrevious review image: `%s`\n\nReturn with the workflow "Rollback" and this image.\n' "$worker" "$review" >> "$GITHUB_STEP_SUMMARY"
      # Terraform ignores the image (lifecycle.ignore_changes); the
      # app version is set only here, immutably by digest.
      - name: Roll out the image
        env:
          IMAGE: ${{ needs.docker-build-push.outputs.image_ref }}
        run: |
          az containerapp job update --name jobfinder-worker --resource-group rg-jobfinder --image "$IMAGE" --output none
          az containerapp update --name jobfinder-review --resource-group rg-jobfinder --image "$IMAGE" --output none
      # Without sign-in the review must serve nothing: a request must redirect
      # to the sign-in (302) or be refused (401). The app only starts with
      # the first request (scale to zero), hence several attempts.
      - name: Check the review without sign-in
        env:
          REVIEW_FQDN: ${{ secrets.REVIEW_FQDN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://$REVIEW_FQDN/api/recommendations" || true)
            case "$status" in
              302|401) echo "Without sign-in: HTTP $status"; exit 0 ;;
              200) echo "::error::The review serves data without sign-in."; exit 1 ;;
            esac
            echo "Attempt $attempt: HTTP $status, next attempt in 20 seconds"
            sleep 20
          done
          echo "::error::The review was not reachable after the deploy."
          exit 1
      - name: Check versions and health
        working-directory: .
        env:
          IMAGE: ${{ needs.docker-build-push.outputs.image_ref }}
        run: bash .github/scripts/verify_rollout.sh "$IMAGE"
