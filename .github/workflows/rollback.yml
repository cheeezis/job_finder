name: Rollback

# Rollt Worker und Review auf ein früheres Image zurück, etwa auf das, das ein
# Deploy unter „Rückweg“ notiert hat. Nur Images der eigenen Registry per Digest;
# läuft wie ein Deploy erst nach Freigabe im production-Environment. Terraform
# und die Datenbank bleiben unverändert: Nach einer inkompatiblen Migration ist
# ein altes Image kein ausreichender Rückweg (siehe docs/backup-recovery.md).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image mit Digest, z. B. acrjobfinder.azurecr.io/jobfinder@sha256:…"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Image prüfen
        run: |
          if ! [[ "$IMAGE" =~ ^acrjobfinder\.azurecr\.io/jobfinder@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Nur Images der eigenen Registry mit Digest sind erlaubt."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Image zurückrollen
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update --name jobfinder-worker --resource-group rg-jobfinder --image "$IMAGE" --output none
          az containerapp update --name jobfinder-review --resource-group rg-jobfinder --image "$IMAGE" --output none
      - name: Review ohne Anmeldung prüfen
        env:
          REVIEW_FQDN: ${{ secrets.REVIEW_FQDN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://$REVIEW_FQDN/api/recommendations" || true)
            case "$status" in
              302|401) echo "Ohne Anmeldung: HTTP $status"; exit 0 ;;
              200) echo "::error::Die Review liefert ohne Anmeldung Daten aus."; exit 1 ;;
            esac
            echo "Versuch $attempt: HTTP $status, neuer Versuch in 20 Sekunden"
            sleep 20
          done
          echo "::error::Die Review war nach dem Rollback nicht erreichbar."
          exit 1
      - name: Versionen und Zustand prüfen
        run: bash .github/scripts/verify_rollout.sh "$IMAGE"
