    reiseanteil:
      ampel: unbekannt
      text: 'Anzeige nennt keine Reisetätigkeit (Quelle: Anzeige).'
    gehalt:
      ampel: unbekannt
      text: 'Anzeige enthält keine Gehaltsangabe (Quelle: Anzeige).'
