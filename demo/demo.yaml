        (Quelle: Anzeige, Profil).'
    luecken:
      ampel: orange
      text: 'Muss vs. Vorteil getrennt – Muss: praktische Erfahrung mit Microsoft 365 und Windows‑Server (Aufgabe laut Anzeige) fehlt in deinem Profil; Netzwerktechnik ist eher durch Studium und Support belegt
        (lernbar). Vorteil: Azure‑Grundlagen und AZ‑900 sind vorhanden (Quelle: Anzeige, Profil).'
    homeoffice_standort:
