      text: 'Anzeige nennt explizit ''Berufseinsteiger:innen sind willkommen'', das unterstützt deinen Berufseinstieg (Quelle: Anzeige, Profil).'
    - thema: Gehalt
      ampel: hinweis
      text: 'kein Gehalt in der Anzeige angegeben; das solltest du vorab klären (Quelle: Anzeige).'
    fazit:
