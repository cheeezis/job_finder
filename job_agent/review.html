<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job-Review</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(960px, calc(100% - 32px)); margin: 36px auto 72px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .subtitle { margin: 8px 0 0; color: #607087; }
    .counter { color: #607087; white-space: nowrap; }
    .filters, .card { background: white; border: 1px solid #dfe4eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(28, 39, 58, .06); }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr 2fr; gap: 12px; padding: 16px; margin: 24px 0; }
    label { display: grid; gap: 6px; font-size: .82rem; color: #607087; }
    select, input, textarea, button, .button { font: inherit; border-radius: 9px; }
    select, input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd3df; background: white; color: #172033; }
    textarea { min-height: 92px; resize: vertical; }
    .card { padding: clamp(20px, 4vw, 36px); }
    .score-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .score { font-size: 1.7rem; font-weight: 750; color: #12664f; }
    .badge { padding: 6px 10px; border-radius: 999px; background: #e7f5ef; color: #12664f; font-size: .84rem; font-weight: 650; }
    h2 { margin: 16px 0 6px; font-size: clamp(1.35rem, 3vw, 2rem); }
    .company { margin: 0; color: #607087; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0; color: #445269; font-size: .92rem; }
    .summary { font-size: 1.08rem; line-height: 1.65; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 28px; }
    .section { margin-top: 20px; }
    .section h3 { margin: 0 0 8px; font-size: 1rem; }
    ul { margin: 0; padding-left: 20px; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #e5e9ef; }
    button, .button { border: 1px solid #c4cdd9; background: white; padding: 10px 15px; color: #172033; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { background: #f3f5f8; }
    button.primary { background: #176b54; color: white; border-color: #176b54; }
    button.ignore { color: #8a3840; }
    .status-select { margin-left: auto; width: auto; min-width: 150px; }
    .personal-actions { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .personal-actions strong { margin-right: 4px; }
    .note-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .navigation { display: flex; justify-content: space-between; margin-top: 16px; }
    .empty, .error { padding: 36px; text-align: center; color: #607087; }
    .error { color: #8a3840; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      header { display: block; }
      .counter { margin-top: 12px; }
      .filters, .details { grid-template-columns: 1fr; }
      .status-select { margin-left: 0; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Job-Review</h1>
      <p class="subtitle">Eine Empfehlung nach der anderen – du entscheidest.</p>
    </div>
    <div id="counter" class="counter"></div>
  </header>

  <section class="filters" aria-label="Filter">
    <label>Status
      <select id="status-filter"><option value="">Alle Status</option></select>
    </label>
    <label>Empfehlung
      <select id="recommendation-filter">
        <option value="">Alle Empfehlungen</option>
        <option value="strong_match">Sehr passend</option>
        <option value="match">Passend</option>
        <option value="borderline">Vielleicht passend</option>
        <option value="not_recommended">Nicht empfohlen</option>
      </select>
    </label>
    <label>Meine Einschätzung
      <select id="personal-rating-filter"><option value="">Alle Einschätzungen</option></select>
    </label>
    <label>Suche
      <input id="search-filter" type="search" placeholder="Titel oder Firma">
    </label>
  </section>

  <section id="message" class="empty">Empfehlungen werden geladen …</section>
  <article id="card" class="card" hidden>
    <div class="score-row">
      <span id="score" class="score"></span>
      <span id="recommendation" class="badge"></span>
    </div>
    <h2 id="title"></h2>
    <p id="company" class="company"></p>
    <div class="meta">
      <span id="location"></span>
      <span id="remote"></span>
      <span id="current-status"></span>
    </div>
    <p id="summary" class="summary"></p>
    <div id="details" class="details"></div>
    <div class="actions">
      <button data-quick-status="interesting" class="primary">Interessant</button>
      <button data-quick-status="review">Später prüfen</button>
      <button data-quick-status="ignored" class="ignore">Ignorieren</button>
      <a id="job-link" class="button" target="_blank" rel="noopener noreferrer">Anzeige öffnen</a>
      <select id="status-select" class="status-select" aria-label="Workflow-Status"></select>
    </div>
    <section class="section">
      <h3>Meine Einschätzung</h3>
      <div class="personal-actions">
        <strong id="personal-rating"></strong>
        <button data-personal-rating="very_interesting" class="primary">Sehr interessant</button>
        <button data-personal-rating="interesting">Interessant</button>
        <button data-personal-rating="maybe">Vielleicht</button>
        <button data-personal-rating="not_interesting" class="ignore">Nicht interessant</button>
      </div>
    </section>
    <section class="section">
      <h3>Meine Notiz</h3>
      <textarea id="review-note" maxlength="2000" placeholder="Optional: Warum passt oder passt die Stelle nicht?"></textarea>
      <div class="note-actions"><button id="save-note">Notiz speichern</button></div>
    </section>
  </article>

  <nav id="navigation" class="navigation" hidden>
    <button id="previous">← Zurück</button>
    <button id="next">Weiter →</button>
  </nav>
</main>

<script>
  const statusLabels = {
    new: "Neu", review: "Später prüfen", interesting: "Interessant",
    ignored: "Ignoriert", applied: "Beworben", interview: "Interview",
    rejected: "Absage", offer: "Angebot", closed: "Abgeschlossen"
  };
  const recommendationLabels = {
    strong_match: "Sehr passend", match: "Passend",
    borderline: "Vielleicht passend", not_recommended: "Nicht empfohlen"
  };
  const personalRatingLabels = {
    very_interesting: "Sehr interessant", interesting: "Interessant",
    maybe: "Vielleicht", not_interesting: "Nicht interessant"
  };
  let jobs = [];
  let visibleJobs = [];
  let currentIndex = 0;

  const element = id => document.getElementById(id);

  function addOptions(select, values) {
    values.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = statusLabels[value] || value;
      select.append(option);
    });
  }

  function setText(id, value) {
    element(id).textContent = value || "";
  }

  function addList(parent, heading, values) {
    if (!values || !values.length) return;
    const section = document.createElement("section");
    section.className = "section";
    const title = document.createElement("h3");
    title.textContent = heading;
    const list = document.createElement("ul");
    values.forEach(value => {
      const item = document.createElement("li");
      item.textContent = value;
      list.append(item);
    });
    section.append(title, list);
    parent.append(section);
  }

  function applyFilters() {
    const status = element("status-filter").value;
    const recommendation = element("recommendation-filter").value;
    const personalRating = element("personal-rating-filter").value;
    const query = element("search-filter").value.trim().toLocaleLowerCase("de");
    visibleJobs = jobs.filter(job =>
      (!status || job.workflow_status === status) &&
      (!recommendation || job.recommendation === recommendation) &&
      (!personalRating || job.personal_rating === personalRating) &&
      (!query || `${job.title} ${job.company}`.toLocaleLowerCase("de").includes(query))
    );
    currentIndex = 0;
    render();
  }

  function render() {
    const hasJobs = visibleJobs.length > 0;
    element("card").hidden = !hasJobs;
    element("navigation").hidden = !hasJobs;
    element("message").hidden = hasJobs;
    if (!hasJobs) {
      element("message").textContent = jobs.length
        ? "Keine Empfehlungen passen zu diesen Filtern."
        : "Noch keine KI-Empfehlungen vorhanden. Starte zuerst den Job-Agenten.";
      setText("counter", "0 Empfehlungen");
      return;
    }

    const job = visibleJobs[currentIndex];
    setText("counter", `${currentIndex + 1} von ${visibleJobs.length}`);
    setText("score", `${job.llm_score}%`);
    setText("recommendation", recommendationLabels[job.recommendation] || job.recommendation);
    setText("title", job.title);
    setText("company", job.company);
    setText("location", `Ort: ${(job.locations || []).join(", ") || "unbekannt"}`);
    const remote = job.remote_percentage != null
      ? `${job.remote_percentage}%`
      : job.work_mode === "hybrid" ? "Homeoffice" : "nicht angegeben";
    setText("remote", `Remote: ${remote}`);
    setText("current-status", `Status: ${statusLabels[job.workflow_status] || job.workflow_status}`);
    setText("personal-rating", job.personal_rating
      ? `Meine Einschätzung: ${personalRatingLabels[job.personal_rating] || job.personal_rating}`
      : "Noch nicht eingeschätzt");
    element("review-note").value = job.review_note || "";
    setText("summary", job.summary);
    element("status-select").value = job.workflow_status;
    element("job-link").href = job.url || "#";
    element("job-link").hidden = !job.url;

    const details = element("details");
    details.replaceChildren();
    addList(details, "Wichtigste Aufgaben", job.tasks);
    addList(details, "Wichtigste Anforderungen", job.requirements);
    addList(details, "Passende Erfahrungen", job.matching_evidence);
    addList(details, "Lücken", job.gaps);
    addList(details, "Risiken", job.risks);
    element("previous").disabled = currentIndex === 0;
    element("next").disabled = currentIndex === visibleJobs.length - 1;
  }

  async function changeStatus(workflowStatus) {
    const job = visibleJobs[currentIndex];
    const response = await fetch("/api/status", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({job_id: job.id, workflow_status: workflowStatus})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Status konnte nicht gespeichert werden");
    job.workflow_status = result.workflow_status;
    const original = jobs.find(item => item.id === job.id);
    if (original) original.workflow_status = result.workflow_status;
    if (element("status-filter").value && element("status-filter").value !== result.workflow_status) {
      applyFilters();
    } else if (currentIndex < visibleJobs.length - 1) {
      currentIndex += 1;
      render();
    } else {
      render();
    }
  }

  async function savePersonalReview(personalRating, advance) {
    const job = visibleJobs[currentIndex];
    const response = await fetch("/api/review", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        job_id: job.id,
        personal_rating: personalRating,
        review_note: element("review-note").value
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Einschätzung konnte nicht gespeichert werden");
    job.personal_rating = result.personal_rating;
    job.review_note = result.review_note;
    const original = jobs.find(item => item.id === job.id);
    if (original) {
      original.personal_rating = result.personal_rating;
      original.review_note = result.review_note;
    }
    if (advance && currentIndex < visibleJobs.length - 1) currentIndex += 1;
    render();
  }

  async function load() {
    try {
      const response = await fetch("/api/recommendations");
      if (!response.ok) throw new Error("Empfehlungen konnten nicht geladen werden");
      const result = await response.json();
      jobs = result.recommendations.sort((a, b) => b.llm_score - a.llm_score);
      addOptions(element("status-filter"), result.workflow_statuses);
      addOptions(element("status-select"), result.workflow_statuses);
      addOptions(element("personal-rating-filter"), result.personal_ratings);
      Array.from(element("personal-rating-filter").options).forEach(option => {
        option.textContent = personalRatingLabels[option.value] || option.textContent;
      });
      applyFilters();
    } catch (error) {
      element("message").className = "error";
      element("message").textContent = error.message;
    }
  }

  element("status-filter").addEventListener("change", applyFilters);
  element("recommendation-filter").addEventListener("change", applyFilters);
  element("personal-rating-filter").addEventListener("change", applyFilters);
  element("search-filter").addEventListener("input", applyFilters);
  element("previous").addEventListener("click", () => { currentIndex -= 1; render(); });
  element("next").addEventListener("click", () => { currentIndex += 1; render(); });
  element("status-select").addEventListener("change", event => changeStatus(event.target.value).catch(showError));
  document.querySelectorAll("[data-quick-status]").forEach(button =>
    button.addEventListener("click", () => changeStatus(button.dataset.quickStatus).catch(showError))
  );
  document.querySelectorAll("[data-personal-rating]").forEach(button =>
    button.addEventListener("click", () =>
      savePersonalReview(button.dataset.personalRating, true).catch(showError)
    )
  );
  element("save-note").addEventListener("click", () =>
    savePersonalReview(undefined, false).catch(showError)
  );
  function showError(error) { window.alert(error.message); }
  load();
</script>
</body>
</html>
