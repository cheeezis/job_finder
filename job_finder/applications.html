<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bewerbungsübersicht</title>
  <link rel="stylesheet" href="/app.css?v=3">
</head>
<body class="applications-page">
<main>
  <header>
    <div>
      <p class="eyebrow">02 / Pipeline</p>
      <h1>Bewerbungsübersicht</h1>
      <p class="subtitle">Status, Verlauf und Kennzahlen deiner Bewerbungen.</p>
    </div>
    <a class="nav-link" href="/">← Zur Startseite</a>
  </header>

  <section id="stats" class="stats" aria-label="Bewerbungsstatistik"></section>
  <div class="section-header">
    <h2 class="section-title">Laufende Bewerbungen</h2>
    <button id="archive-toggle" class="secondary" type="button" hidden></button>
  </div>
  <section id="message" class="empty" role="status" aria-live="polite">Bewerbungen werden geladen …</section>
  <p id="action-message" class="feedback" role="status" aria-live="polite" hidden></p>
  <section id="applications" class="applications" aria-label="Laufende Bewerbungen"></section>
  <section id="archive" class="archive" hidden>
    <h2 class="section-title">Abgeschlossene Bewerbungen bearbeiten</h2>
    <p class="archive-note">Nur zur Korrektur von Status und Verlauf einblenden.</p>
    <section id="completed-applications" class="applications" aria-label="Abgeschlossene Bewerbungen"></section>
  </section>
</main>

<script src="/app.js"></script>
<script src="/applications.js"></script>
</body>
</html>
