<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Finder</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(880px, calc(100% - 32px)); margin: clamp(56px, 12vh, 120px) auto 72px; }
    header { max-width: 620px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.8rem); }
    .subtitle { margin: 12px 0 0; color: #607087; font-size: 1.08rem; }
    nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 36px; }
    .choice {
      display: grid;
      min-height: 210px;
      padding: 28px;
      border: 1px solid #dfe4eb;
      border-radius: 16px;
      background: white;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(28, 39, 58, .06);
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .choice:hover {
      border-color: #9ec7ba;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(28, 39, 58, .1);
    }
    .choice:focus-visible { outline: 3px solid #8cc9b6; outline-offset: 3px; }
    .choice-title { font-size: 1.45rem; font-weight: 750; }
    .choice-description { margin-top: 10px; color: #607087; line-height: 1.55; }
    .choice-action { align-self: end; margin-top: 30px; color: #176b54; font-weight: 700; }
    @media (max-width: 650px) {
      nav { grid-template-columns: 1fr; }
      .choice { min-height: 175px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Job Finder</h1>
    <p class="subtitle">Womit möchtest du weitermachen?</p>
  </header>

  <nav aria-label="Bereich auswählen">
    <a class="choice" href="/review">
      <span class="choice-title">Stellen prüfen</span>
      <span class="choice-description">Neue Empfehlungen ansehen und entscheiden.</span>
      <span class="choice-action">Öffnen →</span>
    </a>
    <a class="choice" href="/applications">
      <span class="choice-title">Bewerbungen verwalten</span>
      <span class="choice-description">Verläufe pflegen und Statistiken ansehen.</span>
      <span class="choice-action">Öffnen →</span>
    </a>
  </nav>
</main>
</body>
</html>
