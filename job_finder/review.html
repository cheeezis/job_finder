<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stellen prüfen</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(960px, calc(100% - 32px)); margin: 36px auto 72px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .subtitle { margin: 8px 0 0; color: #607087; }
    .counter { color: #607087; white-space: nowrap; }
    .header-actions { display: grid; gap: 8px; justify-items: end; }
    .overview-link { color: #176b54; white-space: nowrap; }
    .filters, .card { background: white; border: 1px solid #dfe4eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(28, 39, 58, .06); }
    .filters { display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 12px; padding: 16px; margin: 24px 0; align-items: end; }
    label { display: grid; gap: 6px; font-size: .82rem; color: #607087; }
    .filter-toggles { display: grid; gap: 4px; }
    .toggle { display: flex; align-items: center; gap: 8px; min-height: 42px; color: #445269; white-space: nowrap; }
    .toggle input { width: auto; margin: 0; }
    select, input, button, .button { font: inherit; border-radius: 9px; }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid #cbd3df; background: white; color: #172033; }
    .card { padding: clamp(20px, 4vw, 36px); }
    .score-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .score { font-size: 1.7rem; font-weight: 750; color: #12664f; }
    .badge { padding: 6px 10px; border-radius: 999px; background: #e7f5ef; color: #12664f; font-size: .84rem; font-weight: 650; }
    h2 { margin: 16px 0 6px; font-size: clamp(1.35rem, 3vw, 2rem); }
    .company { margin: 0; color: #607087; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0; color: #445269; font-size: .92rem; }
    .prefilter-warning { margin: 18px 0; padding: 12px 14px; border-radius: 9px; background: #fff4dd; color: #704c0b; line-height: 1.45; }
    .rule-facts { display: grid; gap: 8px; margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: #f6f8fa; }
    .rule-fact { line-height: 1.45; }
    .rule-label { font-weight: 700; color: #33445d; }
    .actions { display: grid; gap: 14px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #e5e9ef; }
    .decision-actions, .utility-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .utility-actions { padding-top: 14px; border-top: 1px solid #eef1f5; }
    button, .button { border: 1px solid #c4cdd9; background: white; padding: 10px 15px; color: #172033; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { background: #f3f5f8; }
    button:disabled { cursor: wait; opacity: .65; }
    #job-links { display: flex; }
    .source-menu { position: relative; }
    .source-menu summary { display: block; list-style: none; }
    .source-menu summary::-webkit-details-marker { display: none; }
    .source-options { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 2; display: grid; min-width: 190px; padding: 6px; background: white; border: 1px solid #cbd3df; border-radius: 10px; box-shadow: 0 8px 24px rgba(28, 39, 58, .12); }
    .source-options a { padding: 9px 10px; color: #176b54; text-decoration: none; border-radius: 7px; }
    .source-options a:hover { background: #edf7f3; }
    button.primary { background: #176b54; color: white; border-color: #176b54; }
    button.inquiry { color: #704c0b; border-color: #d5ad61; background: #fff8e8; }
    button.inquiry:hover { background: #fff1cf; }
    button.ignore { color: #8a3840; }
    .navigation { display: flex; justify-content: space-between; margin-top: 16px; }
    .empty, .error { padding: 36px; text-align: center; color: #607087; }
    .error { color: #8a3840; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      header { display: block; }
      .counter { margin-top: 12px; }
      .header-actions { justify-items: start; }
      .filters { grid-template-columns: 1fr; }
      .decision-actions button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Stellen prüfen</h1>
      <p class="subtitle">Eine vorgefilterte Stelle nach der anderen – du entscheidest.</p>
    </div>
    <div class="header-actions">
      <div id="counter" class="counter"></div>
      <a class="overview-link" href="/">← Zur Startseite</a>
    </div>
  </header>

  <section class="filters" aria-label="Filter">
    <label>Status
      <select id="status-filter">
        <option value="new">Neu</option>
        <option value="">Alle Status</option>
      </select>
    </label>
    <label>IT-Bereich
      <select id="role-filter">
        <option value="">Alle Bereiche</option>
      </select>
    </label>
    <label>Suche
      <input id="search-filter" type="search" placeholder="Titel oder Firma">
    </label>
    <div class="filter-toggles">
      <label class="toggle">
        <input id="international-filter" type="checkbox">
        Internationale anzeigen
      </label>
      <label class="toggle">
        <input id="junior-hybrid-filter" type="checkbox">
        Junior-Sonderfälle anzeigen
      </label>
    </div>
  </section>

  <section id="message" class="empty">Stellen werden geladen …</section>
  <article id="card" class="card" hidden>
    <div class="score-row">
      <span id="score" class="score"></span>
      <span id="role-badge" class="badge"></span>
    </div>
    <h2 id="title"></h2>
    <p id="company" class="company"></p>
    <div class="meta">
      <span id="location"></span>
      <span id="remote"></span>
      <span id="published"></span>
      <span id="current-status"></span>
    </div>
    <p id="prefilter-warning" class="prefilter-warning" hidden></p>
    <section class="rule-facts" aria-label="Ergebnis des Vorfilters">
      <div class="rule-fact"><span class="rule-label">Bereich:</span> <span id="role-group"></span></div>
      <div class="rule-fact"><span class="rule-label">Einstieg:</span> <span id="experience-level"></span></div>
      <div class="rule-fact"><span class="rule-label">Standortprüfung:</span> <span id="location-precheck"></span></div>
    </section>
    <div class="actions">
      <div class="decision-actions">
        <button id="mark-interesting" class="primary">Interessant</button>
        <button id="mark-inquiry" class="inquiry">Rückfrage nötig</button>
        <button id="mark-ignored" class="ignore">Nicht interessant</button>
        <button id="undo-ignored" hidden>↶ Rückgängig</button>
      </div>
      <div class="utility-actions">
        <button id="mark-applied">Als beworben markieren</button>
        <a id="application-link" class="button" href="/applications" hidden>Bewerbung verwalten</a>
        <div id="job-links"></div>
        <a id="route-link" class="button" target="_blank" rel="noopener noreferrer" hidden>Entfernung &amp; Fahrtzeit</a>
      </div>
    </div>
  </article>

  <nav id="navigation" class="navigation" hidden>
    <button id="previous">← Zurück</button>
    <button id="next">Weiter →</button>
  </nav>
</main>

<script>
  const roleLabels = {
    general_it: "Allgemeine IT", software_development: "Softwareentwicklung",
    python_ai_data: "Python / KI / Daten", technical_consulting: "Technisches Consulting",
    infrastructure: "Infrastruktur", junior_sap: "SAP-Einstieg",
    testing: "Testing / QA", junior_administration: "IT-Administration",
    rpa_automation: "RPA / Automatisierung", trainee: "Trainee",
    junior_modern_workplace: "Modern Workplace",
    infrastructure_automation: "Infrastruktur-Automatisierung",
    manual_review: "Manuell hinzugefügt"
  };
  const statusLabels = {
    new: "Neu", review: "Prüfen", interesting: "Interessant", inquiry: "Rückfrage offen",
    ignored: "Nicht interessant", applied: "Beworben", response: "Antwort erhalten", interview: "Interview",
    rejected: "Absage", no_response: "Keine Rückmeldung",
    offer: "Angebot", closed: "Abgeschlossen"
  };
  const sourceLabels = {
    original: "Originalanzeige", stepstone: "StepStone",
    get_in_it: "get-in-IT", arbeitnow: "Arbeitnow",
    arbeitsagentur: "Arbeitsagentur", studysmarter: "StudySmarter",
    manual: "Manuell hinzugefügt"
  };
  const reviewStatuses = new Set(["review", "interesting", "inquiry", "ignored"]);
  let jobs = [];
  let visibleJobs = [];
  let currentIndex = 0;
  let routeOrigin = "";
  let undoDecision = null;

  const element = id => document.getElementById(id);

  function addOptions(select, values, labels) {
    values.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = labels[value] || value;
      select.append(option);
    });
  }

  function setText(id, value) {
    element(id).textContent = value || "";
  }

  function safeUrl(value) {
    try {
      const url = new URL(value);
      return ["http:", "https:"].includes(url.protocol) ? url.href : "";
    } catch {
      return "";
    }
  }

  function renderSourceLinks(job) {
    const container = element("job-links");
    container.replaceChildren();
    const candidates = (job.source_links || []).length
      ? job.source_links
      : [{source: "listing", url: job.url}];
    const seen = new Set();
    const links = candidates.flatMap((item, index) => {
      const url = safeUrl(item.url);
      if (!url || seen.has(url)) return [];
      seen.add(url);
      return [{
        url,
        label: sourceLabels[item.source] || `Anzeige ${index + 1}`
      }];
    });
    if (!links.length) return;
    if (links.length === 1) {
      const link = document.createElement("a");
      link.className = "button";
      link.textContent = "Anzeige öffnen";
      link.href = links[0].url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      container.append(link);
      return;
    }
    const menu = document.createElement("details");
    menu.className = "source-menu";
    const summary = document.createElement("summary");
    summary.className = "button";
    summary.textContent = `Anzeigen öffnen (${links.length})`;
    const options = document.createElement("div");
    options.className = "source-options";
    links.forEach(item => {
      const link = document.createElement("a");
      link.textContent = item.label;
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      options.append(link);
    });
    menu.append(summary, options);
    container.append(menu);
  }

  function routeDestination(job) {
    const ignored = new Set([
      "deutschland", "germany", "bundesweit", "deutschlandweit",
      "remote", "hybrid"
    ]);
    return (job.locations || [])
      .flatMap(value => String(value).split(","))
      .map(value => value.trim().replace(/^u\.\s*a\.\s*/i, ""))
      .find(value => value && !ignored.has(value.toLocaleLowerCase("de"))) || "";
  }

  function renderRouteLink(job) {
    const link = element("route-link");
    const isJuniorHybridException = String(job.location_precheck || "")
      .startsWith("Junior-Hybrid");
    const isManualHybridConflict = job.prefilter_warning === "Ort/Remote passt nicht"
      && job.work_mode === "hybrid";
    const destination = routeDestination(job);
    link.hidden = !(routeOrigin && destination && (
      isJuniorHybridException || isManualHybridConflict
    ));
    if (link.hidden) {
      link.removeAttribute("href");
      return;
    }
    const parameters = new URLSearchParams({
      api: "1",
      origin: `${routeOrigin}, Deutschland`,
      destination: `${destination}, Deutschland`
    });
    link.href = `https://www.google.com/maps/dir/?${parameters}`;
  }

  function displayDate(value) {
    if (!value) return "nicht angegeben";
    const date = new Date(`${String(value).slice(0, 10)}T00:00:00`);
    return Number.isNaN(date.getTime())
      ? String(value)
      : date.toLocaleDateString("de-DE");
  }

  function applyFilters(resetPosition = true) {
    const status = element("status-filter").value;
    const role = element("role-filter").value;
    const query = element("search-filter").value.trim().toLocaleLowerCase("de");
    const showInternational = element("international-filter").checked;
    const showJuniorHybrid = element("junior-hybrid-filter").checked;
    visibleJobs = jobs.filter(job =>
      (!status || job.workflow_status === status) &&
      (!role || job.role_group === role) &&
      (showInternational || !job.international) &&
      (showJuniorHybrid || !String(job.location_precheck || "").startsWith("Junior-Hybrid")) &&
      (!query || `${job.title} ${job.company}`.toLocaleLowerCase("de").includes(query))
    );
    currentIndex = resetPosition
      ? 0
      : Math.min(currentIndex, Math.max(visibleJobs.length - 1, 0));
    render();
  }

  function render() {
    element("undo-ignored").hidden = !undoDecision;
    const hasJobs = visibleJobs.length > 0;
    element("card").hidden = !hasJobs;
    element("navigation").hidden = !hasJobs;
    element("message").hidden = hasJobs;
    if (!hasJobs) {
      element("message").textContent = jobs.length
        ? "Keine Stellen passen zu diesen Filtern."
        : "Noch keine Stellen vorhanden. Starte zuerst den Job Finder.";
      setText("counter", "0 Stellen");
      return;
    }

    const job = visibleJobs[currentIndex];
    setText("counter", `${currentIndex + 1} von ${visibleJobs.length}`);
    setText("score", `Vorfilter: ${job.match_percent ?? 0}/100`);
    setText("role-badge", roleLabels[job.role_group] || "Allgemeine IT");
    setText("title", job.title);
    setText("company", job.company);
    setText("location", `Ort: ${(job.locations || []).join(", ") || "unbekannt"}`);
    const remote = job.remote_percentage != null
      ? `${job.remote_percentage}%`
      : job.work_mode === "hybrid" ? "Homeoffice" : "nicht angegeben";
    setText("remote", `Remote: ${remote}`);
    setText("published", `Veröffentlicht: ${displayDate(job.published_at)}`);
    setText("current-status", `Status: ${statusLabels[job.workflow_status] || job.workflow_status}`);
    setText("role-group", roleLabels[job.role_group] || "Allgemeine IT");
    setText("experience-level", job.experience_level || "keine Jahresanforderung erkannt");
    setText("location-precheck", job.location_precheck || "passt zur Standortregel");
    const applicationTracked = Boolean(job.application_tracked);
    element("mark-interesting").hidden = applicationTracked;
    element("mark-inquiry").hidden = applicationTracked;
    element("mark-ignored").hidden = applicationTracked;
    element("mark-applied").hidden = applicationTracked;
    element("application-link").hidden = !applicationTracked;
    const warning = element("prefilter-warning");
    warning.hidden = !job.prefilter_warning;
    warning.textContent = job.prefilter_warning
      ? `Hinweis aus dem Vorfilter: ${job.prefilter_warning}`
      : "";
    renderSourceLinks(job);
    renderRouteLink(job);
    element("previous").disabled = currentIndex === 0;
    element("next").disabled = currentIndex === visibleJobs.length - 1;
  }

  function applyWorkflowResult(job, result) {
    job.workflow_status = result.workflow_status;
    if (result.application_tracked != null) {
      job.application_tracked = result.application_tracked;
    }
    const original = jobs.find(item => item.id === job.id);
    if (original) {
      original.workflow_status = result.workflow_status;
      original.application_tracked = job.application_tracked;
    }
    if (element("status-filter").value && element("status-filter").value !== result.workflow_status) {
      applyFilters(false);
    } else if (currentIndex < visibleJobs.length - 1) {
      currentIndex += 1;
      render();
    } else {
      render();
    }
  }

  async function changeStatus(workflowStatus) {
    const job = visibleJobs[currentIndex];
    const previousStatus = job.workflow_status;
    const response = await fetch("/api/review-status", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        job_id: job.id,
        workflow_status: workflowStatus
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Status konnte nicht gespeichert werden");
    undoDecision = workflowStatus === "ignored"
      ? {jobId: job.id, expectedStatus: result.workflow_status, previousStatus}
      : null;
    applyWorkflowResult(job, result);
  }

  async function undoIgnored() {
    if (!undoDecision) return;
    const decision = undoDecision;
    const response = await fetch("/api/review-undo", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        job_id: decision.jobId,
        expected_status: decision.expectedStatus
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Entscheidung konnte nicht rückgängig gemacht werden");
    const job = jobs.find(item => item.id === decision.jobId);
    if (job) job.workflow_status = result.workflow_status;
    undoDecision = null;
    if ([...element("status-filter").options].some(option => option.value === result.workflow_status)) {
      element("status-filter").value = result.workflow_status;
    }
    applyFilters();
    const restoredIndex = visibleJobs.findIndex(item => item.id === decision.jobId);
    if (restoredIndex >= 0) currentIndex = restoredIndex;
    render();
  }

  async function startApplication() {
    const job = visibleJobs[currentIndex];
    const button = element("mark-applied");
    button.disabled = true;
    try {
      const response = await fetch("/api/applications", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({job_id: job.id})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Bewerbung konnte nicht gespeichert werden");
      applyWorkflowResult(job, result);
    } finally {
      button.disabled = false;
    }
  }

  async function load() {
    try {
      const response = await fetch("/api/recommendations");
      if (!response.ok) throw new Error("Empfehlungen konnten nicht geladen werden");
      const result = await response.json();
      routeOrigin = result.route_origin || "";
      jobs = result.recommendations.sort((a, b) => {
        const score = (b.match_percent ?? -1) - (a.match_percent ?? -1);
        if (score) return score;
        const published = String(b.published_at || "").localeCompare(String(a.published_at || ""));
        if (published) return published;
        const firstSeen = String(b.first_seen_at || "").localeCompare(String(a.first_seen_at || ""));
        return firstSeen;
      });
      addOptions(
        element("status-filter"),
        result.workflow_statuses.filter(status => reviewStatuses.has(status)),
        statusLabels
      );
      addOptions(
        element("role-filter"),
        [...new Set(jobs.map(job => job.role_group).filter(Boolean))].sort(),
        roleLabels
      );
      const requestedJob = new URLSearchParams(window.location.search).get("job");
      if (requestedJob) element("status-filter").value = "";
      applyFilters();
      if (requestedJob) {
        const requestedIndex = visibleJobs.findIndex(job => job.id === requestedJob);
        if (requestedIndex >= 0) {
          currentIndex = requestedIndex;
          render();
        }
      }
    } catch (error) {
      element("message").className = "error";
      element("message").textContent = error.message;
    }
  }

  element("status-filter").addEventListener("change", () => applyFilters());
  element("role-filter").addEventListener("change", () => applyFilters());
  element("search-filter").addEventListener("input", () => applyFilters());
  element("international-filter").addEventListener("change", () => applyFilters());
  element("junior-hybrid-filter").addEventListener("change", () => applyFilters());
  element("previous").addEventListener("click", () => { currentIndex -= 1; render(); });
  element("next").addEventListener("click", () => { currentIndex += 1; render(); });
  element("mark-interesting").addEventListener("click", () =>
    changeStatus("interesting").catch(showError)
  );
  element("mark-inquiry").addEventListener("click", () =>
    changeStatus("inquiry").catch(showError)
  );
  element("mark-ignored").addEventListener("click", () =>
    changeStatus("ignored").catch(showError)
  );
  element("undo-ignored").addEventListener("click", () =>
    undoIgnored().catch(showError)
  );
  element("mark-applied").addEventListener("click", () =>
    startApplication().catch(showError)
  );
  function showError(error) { window.alert(error.message); }
  load();
</script>
</body>
</html>
