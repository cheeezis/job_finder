[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-finder"
version = "0.2.0"
description = "Job-search assistant for entry-level IT roles with a cost-limited LLM agent, PostgreSQL and Azure"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["job-search", "job-tracker", "llm-agent", "langgraph", "azure", "postgresql", "terraform"]
# Ranges here; the exact versions every build installs are in uv.lock.
dependencies = [
    "PyYAML>=6.0,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "azure-storage-blob>=12.24,<13",
    "azure-identity>=1.19,<2",
    "openai>=2.54,<3",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
]

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.uv]
# The code runs from the checkout (run_finder.py, python -m job_finder.review),
# so uv installs only the dependencies, not the project itself.
package = false

[tool.setuptools.package-data]
job_finder = ["*.html", "*.css", "*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120
# Scripts import their shared helpers from scripts/ as first-party modules.
src = [".", "scripts"]
extend-exclude = ["data", "tmp"]

[tool.ruff.format]
# Use one line whenever it fits; a trailing comma alone does not force one
# item per line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Besides the defaults: invalid escape sequences, simplifications, return
# style, comprehensions, small pitfalls and datetime.UTC. UP042 (StrEnum)
# stays off because it changes format() and the psycopg enum adaptation.
select = ["E4", "E7", "E9", "W605", "F", "I", "D", "SIM", "RET", "C4", "PIE", "UP017"]
# Docstrings are optional (D1xx off): write one where it says more than the
# name. Existing docstrings still follow the pep257 format rules.
ignore = ["D1"]

[tool.ruff.lint.isort]
# Keep all names imported from one module in one statement.
split-on-trailing-comma = false
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
