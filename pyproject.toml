[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-job-finder"
version = "0.2.0"
description = "Local-first multi-source IT job finder with review and application tracking"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["job-search", "job-tracker", "postgresql", "discord"]
dependencies = [
    "PyYAML>=6.0,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "azure-storage-blob>=12.24,<13",
    "azure-identity>=1.19,<2",
]

[tool.setuptools.package-data]
job_finder = ["*.html", "*.css", "*.js"]

[tool.ruff]
required-version = "==0.16.7"
target-version = "py311"
line-length = 100
# Scripts import their shared helpers from scripts/ as first-party modules.
src = [".", "scripts"]
extend-exclude = ["data", "tmp", "llm_evaluation"]

[tool.ruff.format]
# Use one line whenever it fits; a trailing comma alone does not force one
# item per line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Besides the defaults: simplifications, return style, comprehensions,
# small pitfalls and datetime.UTC. UP042 (StrEnum) stays off because it
# changes format() and the psycopg enum adaptation.
select = ["E4", "E7", "E9", "F", "I", "D", "SIM", "RET", "C4", "PIE", "UP017"]
# Class docstrings describe construction; standard protocol methods need
# no repeated documentation unless their behavior differs from the protocol.
ignore = ["D105", "D107"]

[tool.ruff.lint.isort]
# Keep all names imported from one module in one statement.
split-on-trailing-comma = false
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
