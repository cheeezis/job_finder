[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-job-finder"
version = "0.2.0"
description = "Local-first multi-source IT job finder with review and application tracking"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["job-search", "job-tracker", "sqlite", "discord"]
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.package-data]
job_finder = ["*.html", "*.css"]
