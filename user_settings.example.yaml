# Diese Datei nach user_settings.local.yaml kopieren und nur die Beispieldaten
# ersetzen. Die lokale Datei wird von Git ignoriert.
search:
  local_location: Musterstadt
  local_postal_code: "00000"
  local_radius_km: 25

matching:
  # Lesbare Ortsbezeichnung für Review und StudySmarter-Suche.
  preferred_location_label: Musterstadt
  # Kleingeschriebene Ortsnamen, die im Anzeigentext als lokal gelten.
  local_places:
    - musterstadt
  # Optionale Pendlersuchen. Beispiel:
  # commuter_locations:
  #   - search_location: Beispielstadt
  #     aliases: [beispielstadt]
  #     excluded_aliases: []
  #     minimum_remote_percentage: 60
  commuter_locations: []
  # Fachbegriffe aus Projekten oder Weiterbildungen: zusammen maximal +5 Punkte.
  # Keine Muss-Kriterien; Treffer belegen keine praktische Berufserfahrung.
  profile_domain_keywords: []
  # Optionale Jahresbrutto-Präferenzen in Euro.
  salary_target_eur: null
  salary_minimum_eur: null

# Optionaler KI-Agent für Steckbriefe. Ohne diesen Abschnitt, mit
# enabled: false oder bei einem ungültigen Wert ruft der Finder kein
# Sprachmodell auf. Fehlende Grenzen gelten mit den hier gezeigten Werten.
agent:
  enabled: false
  # Pro Stelle: Kosten in Euro, Modell- und Werkzeugaufrufe.
  job_max_cost_eur: 0.05
  job_max_model_calls: 8
  job_max_tool_calls: 6
  # Kosten pro Tag und pro Monat über alle Läufe zusammen: eine Sicherung
  # gegen Fehler, kein Filter.
  daily_max_cost_eur: 1.00
  monthly_max_cost_eur: 20.00
